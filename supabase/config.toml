project_id = "urban-cowboy-rentals"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[functions.rental-documents]
verify_jwt = true

[functions.rental-quotes]
verify_jwt = true

# Provider callbacks authenticate using their verified Svix signatures.
[functions.quote-events]
verify_jwt = false
